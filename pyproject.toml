[project]
name = "spargel-llm-pab"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "spargel-llm[cpu]>=0.15.0",
    "tensorboard>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
spargel-llm = { path = "../spargel-llm", editable = true }
spargel-llm-pab = { workspace = true, editable = true }

[tool.uv.workspace]
members = ["."]

[dependency-groups]
dev = ["ipykernel>=7.2.0", "pytest>=9.1.0", "ruff>=0.16.1", "spargel-llm-pab"]

[tool.ruff.lint.isort]
known-first-party = ["spargel_llm"]
